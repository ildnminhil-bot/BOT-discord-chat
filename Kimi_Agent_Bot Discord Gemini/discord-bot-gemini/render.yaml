# Render Blueprint - tao Web Service chay bot Discord
services:
  - type: web
    name: discord-bot-gemini
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OWNER_IDS
        sync: false
      - key: SUPPORT_CONTACT
        value: "@admin"
